<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo do Astronauta - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="caixa">
        <h1>Jogo do Astronauta</h1>
        <p>Ajude o astronauta a desviar das pedras e dos buracos negros do espaço!</p>

        <label for="nome">Digite seu nome:</label>
        <input type="text" id="nome" maxlength="15" placeholder="Seu nome aqui">
        <button onclick="entrar()">Jogar</button>

        <p class="dica">Use a tecla <b>ESPAÇO</b> ou a <b>seta pra cima</b> para pular.</p>
    </div>

    <script src="login.js"></script>
</body>
</html>
